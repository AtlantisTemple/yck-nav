<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="基于 yckceo_data.json 的本地收藏导航页">
  <title>收藏导航</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('yck-nav-theme') || 'auto';
        if (t === 'auto') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">收藏导航</div>
          <div class="brand-sub">YCK 数据源</div>
        </div>
      </div>
      <nav class="cat-list" id="catList" aria-label="分类导航"></nav>
      <div class="side-foot">
        <button class="adult-btn" id="adultBtn" type="button"></button>
        <p class="side-note">数据来自 yckceo_data.json，仅在本地运行。</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-row">
          <div class="title-block">
            <h1 id="pageTitle">全部收藏</h1>
            <p id="pageMeta"></p>
          </div>
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
            </span>
            <input id="searchInput" type="search" placeholder="搜索站点、域名或分类" autocomplete="off" aria-label="搜索站点">
            <button id="clearBtn" class="icon-btn search-clear" type="button" title="清空搜索" aria-label="清空搜索" hidden>
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
              </svg>
            </button>
          </div>
          <div class="top-actions">
            <div class="seg" role="group" aria-label="视图切换">
              <button id="gridViewBtn" class="seg-btn active" type="button" title="网格视图" aria-label="网格视图">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="7" height="7" x="3" y="3" rx="1"></rect>
                  <rect width="7" height="7" x="14" y="3" rx="1"></rect>
                  <rect width="7" height="7" x="14" y="14" rx="1"></rect>
                  <rect width="7" height="7" x="3" y="14" rx="1"></rect>
                </svg>
              </button>
              <button id="listViewBtn" class="seg-btn" type="button" title="列表视图" aria-label="列表视图">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="8" x2="21" y1="6" y2="6"></line>
                  <line x1="8" x2="21" y1="12" y2="12"></line>
                  <line x1="8" x2="21" y1="18" y2="18"></line>
                  <line x1="3" x2="3.01" y1="6" y2="6"></line>
                  <line x1="3" x2="3.01" y1="12" y2="12"></line>
                  <line x1="3" x2="3.01" y1="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <select id="sortSelect" class="select" aria-label="排序方式">
              <option value="default">默认排序</option>
              <option value="name">按名称</option>
              <option value="domain">按域名</option>
            </select>
            <button id="themeBtn" class="icon-btn" type="button" title="切换主题" aria-label="切换主题"></button>
          </div>
        </div>
        <div class="cat-strip" id="catStrip" aria-label="分类快捷切换"></div>
      </header>

      <section id="results" class="results grid" aria-live="polite"></section>
      <div id="loadWrap" class="load-wrap" hidden>
        <button id="loadMore" class="load-btn" type="button">加载更多</button>
      </div>

      <footer class="site-foot">
        <span>共 <span id="statTotal">0</span> 条链接 · <span id="statCats">0</span> 个分类</span>
        <span>本地静态页面，不收集任何数据</span>
      </footer>
    </main>
  </div>

  <div id="adultModal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="adultTitle">
      <div class="modal-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 id="adultTitle">显示成人分类？</h2>
      <p>数据源中包含成人内容与美女图片分类，开启后这些分类会出现在导航中，并在当前浏览器记住你的选择。</p>
      <div class="modal-actions">
        <button id="adultYes" class="primary-btn" type="button">显示并记住</button>
        <button id="adultNo" class="ghost-btn" type="button">取消</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
